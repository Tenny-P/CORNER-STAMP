<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CORNER STAMP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* 모바일 주소창 높이 완벽 대응 */
      overflow: hidden;
      background-color: #0b0f19;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="appFrame" 
    src="" 
    allow="fullscreen" 
    loading="eager">
  </iframe>

  <script>
    // ⚠️ [중요] 아래 큰따옴표 안에 1단계에서 복사한 사장님의 구글 웹앱 주소를 넣으세요!
    var GAS_URL = "https://script.google.com/macros/s/AKfycbypedm_HVBZoW-YEbo_WpuqCRHeyFoPTDGlcyDGa_4JaAhByN5iltGW8BiREGury56R/exec
";

    // NFC 도장으로 넘어온 ?k=... 보안 키를 그대로 붙여서 전달
    var currentParams = window.location.search;
    if (!currentParams || currentParams.indexOf("k=") === -1) {
      currentParams = "?k=CORNER_STAMP_TOKEN";
    }

    var fullTargetUrl = GAS_URL + currentParams;

    // 아이프레임 주소 즉시 로드
    document.getElementById("appFrame").src = fullTargetUrl;
  </script>
</body>
</html>
