<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CORNER STAMP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19; /* 배경 깜빡임 방지 */
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <script>
    // 1. 배포된 사장님의 구글 웹앱 주소 (/exec 로 끝나는 주소)
    var GAS_BASE_URL = "https://script.google.com/home/projects/1K5LqJZwfrRDERm_JGa-YBz1u13TzjA1M5YagaH2_Pqvyuv2f-w4GvG58/edit

";

    // 2. NFC 태그로부터 전달된 파라미터(?k=...)를 그대로 전달
    var currentParams = window.location.search; 
    var targetUrl = GAS_BASE_URL + currentParams;

    // 3. 배너 없는 전체 화면 프레임 생성
    var iframe = document.createElement("iframe");
    iframe.src = targetUrl;
    iframe.allow = "fullscreen";
    document.body.appendChild(iframe);
  </script>
</body>
</html>
