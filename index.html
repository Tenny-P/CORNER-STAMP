<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CORNER STAMP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <script>
    // ⚠️ [중요] 아래 큰따옴표 안에 복사하신 구글 웹앱 주소를 붙여넣어 주세요!
    var GAS_URL = "https://script.google.com/macros/s/AKfycbyMJI9w8Q4JS3SMF7_H7mnbsGpIS-y9DdzmnR7A7unvW_UihcDNe5C24vhih2N_r6d0/exec";

    // URL 파라미터(?k=...)를 추출하여 구글 웹앱으로 안전하게 전달
    var queryString = window.location.search;
    if (!queryString || queryString.indexOf("k=") === -1) {
      queryString = "?k=CORNER_STAMP_TOKEN";
    }

    var targetUrl = GAS_URL + queryString;

    // 배너 없는 전체 화면 생성
    var iframe = document.createElement("iframe");
    iframe.src = targetUrl;
    iframe.allow = "fullscreen";
    document.body.appendChild(iframe);
  </script>
</body>
</html>
